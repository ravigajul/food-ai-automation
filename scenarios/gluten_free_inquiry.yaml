name: Dietary Info Inquiry — Gluten-Free Crust Before Ordering
description: >
  Customer asks whether a gluten-free crust is available before committing to
  their order. After the agent responds (redirecting to check details or
  explaining availability), the customer places a regular large pepperoni pizza
  order. Tests that a pre-order dietary inquiry is handled and the ordering
  flow continues without confusion.
persona: gluten_free_inquiry
